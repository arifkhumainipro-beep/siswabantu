name: Deploy SiswaBantu Mobile App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: siswabantu_mobile
        run: flutter pub get

      - name: Build Flutter Mobile Web (PWA / Live App)
        working-directory: siswabantu_mobile
        run: flutter build web --release --base-href "/siswabantu/"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './siswabantu_mobile/build/web'

      - name: Build Android APK
        working-directory: siswabantu_mobile
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SiswaBantu-Mobile-v2.0-Release-APK
          path: siswabantu_mobile/build/app/outputs/flutter-apk/app-release.apk

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Deploy Flutter Mobile to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
